# Build and JVM tests on every push/PR. Instrumented tests, measurements and test-vector
# export need real devices (Keystore, StrongBox) and run via tools/*.sh, not here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: unit tests
        run: ./gradlew --no-daemon :devicetrust:testDebugUnitTest

      - name: no Firebase / Play Services (S2 §15 п. 1)
        run: ./gradlew --no-daemon checkForbiddenDependencies

      - name: assemble (AAR, sample app, test APKs)
        run: ./gradlew --no-daemon :devicetrust:assembleRelease :devicetrust:assembleDebugAndroidTest :sample:assembleDebug :sample:assembleDebugAndroidTest

      - name: native strings encrypted (S2 §7.5)
        run: ./gradlew --no-daemon :devicetrust:checkNativeStrings

      - name: native host tests (APK Signing Block reader, string table; ASan/UBSan)
        run: devicetrust-native/test/run.sh sample/build/outputs/apk/debug/sample-debug.apk

      - name: pilot build (S2 §7.3) with a throwaway release key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.p12" -storetype PKCS12 -storepass ci-pass -keypass ci-pass \
            -alias wolp -keyalg EC -groupname secp256r1 -sigalg SHA256withECDSA -dname "CN=ci" -validity 30
          SIGN="-Pwolp.signing.storeFile=$RUNNER_TEMP/release.p12 -Pwolp.signing.storePassword=ci-pass -Pwolp.signing.keyAlias=wolp -Pwolp.signing.keyPassword=ci-pass"
          ./gradlew --no-daemon $SIGN :pilot:assembleProductRelease :pilot:assemblePilotRelease
          # a product build in the pilot versionCode range must be refused
          if ./gradlew --no-daemon -q $SIGN -Pwolp.productVersionCode=10295 :pilot:verifyProductReleaseBuildKind; then
            echo "verifyProductReleaseBuildKind accepted a pilot-range versionCode"; exit 1
          fi
          # the app strips libwolpdt.so (ndkVersion set) — no symbols or debug info in the APK
          for apk in pilot/build/outputs/apk/*/release/*.apk; do
            unzip -p "$apk" lib/arm64-v8a/libwolpdt.so > "$RUNNER_TEMP/libwolpdt.so"
            file "$RUNNER_TEMP/libwolpdt.so" | tee /dev/stderr | grep -q ', stripped'
          done

      - name: sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/sample-debug.apk
          retention-days: 30
